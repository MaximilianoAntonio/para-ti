<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
  <title>Tulipanes para ti</title>
  <meta name="theme-color" content="#040108">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas principal interactivo de alta definicion -->
  <canvas id="main-stage"></canvas>

  <!-- Pantalla de Bienvenida / Apertura Inmersiva -->
  <div id="intro-screen">
    <div class="intro-content" id="open-trigger" role="button" tabindex="0" aria-label="Toca para abrir">
      <div class="orb-container">
        <div class="orb-ring ring-1"></div>
        <div class="orb-ring ring-2"></div>
        <div class="orb-core">
          <svg class="tulip-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C10.5 4 8 7 8 10c0 3 2 5.5 4 6 2-.5 4-3 4-6 0-3-2.5-6-4-8zm-5 4C5.5 7.5 4 10 4 12c0 2.8 1.8 5.1 4.2 5.8C7.5 16.3 7 14.7 7 13c0-2.4 1-4.7 2-6.5-1-.2-1.5-.3-2-.5zm10 0c-.5.2-1 .3-2 .5 1 1.8 2 4.1 2 6.5 0 1.7-.5 3.3-1.2 4.8 2.4-.7 4.2-3 4.2-5.8 0-2-1.5-4.5-3-6zM11 17.9v4.1h2v-4.1c-.3.05-.7.1-1 .1s-.7-.05-1-.1z"/>
          </svg>
        </div>
      </div>
      <div class="intro-text-group">
        <span class="intro-eyebrow">TULIPANES EN LUZ</span>
        <h1 class="intro-heading">Para alguien especial</h1>
        <div class="intro-action-badge">
          <span class="pulse-dot"></span>
          <span class="badge-label">Toca para abrir</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Barra de controles flotante con estilo Glassmorphism -->
  <nav id="control-dock" class="dock-hidden" aria-label="Controles">
    <button id="theme-btn" class="dock-btn" title="Cambiar paleta de colores" aria-label="Cambiar estilo de color">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 0 1 9 9 9 9 0 0 1-9 9V3z"/>
      </svg>
    </button>
    <button id="reset-btn" class="dock-btn" title="Ajustar y centrar en pantalla" aria-label="Restablecer vista centrada">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
      </svg>
    </button>
    <button id="audio-btn" class="dock-btn" title="Silenciar o activar musica" aria-label="Activar o desactivar sonido">
      <svg id="icon-audio-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
      </svg>
      <svg id="icon-audio-off" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>
  </nav>

  <!-- Notificacion guia sutil -->
  <div id="gesture-hint" class="hint-hidden">
    <span>Arrastra para mover - Pellizca para zoom</span>
  </div>

  <script src="art.js"></script>
  <script src="script.js"></script>
</body>
</html>
